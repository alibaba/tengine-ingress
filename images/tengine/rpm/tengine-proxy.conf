user admin;

worker_rlimit_nofile        100000;

error_log                   "pipe:/opt/taobao/install/cronolog/sbin/cronolog logs/cronolog/%Y/%m/%Y-%m-%d-error_log" warn;
pid                         logs/tengine-proxy.pid;

# Removed Tengine DSO feature, use nginx dynamic modules feature instead.
# Forexample:
# load_module "/path/xxx.so"; # Must be configured before the events block.

#include dso.conf;

events {
    use                     epoll;
    worker_connections      20480;
    accept_mutex on; # After tengine-proxy-2.3.0 version, default accept_mutex off.
}

#include tmd_main.conf;

http {
    default_type            application/octet-stream;

    root                    htdocs;

    sendfile                on;
    tcp_nopush              on;

    server_tokens           off;

    keepalive_timeout       0;

    client_header_timeout   1m;
    send_timeout            1m;
    client_max_body_size    3m;
    client_body_temp_path   data/client_body;

    index                   index.html index.htm;

    log_format              proxyformat    "$remote_addr||$request_time_usec||$time_local||$request_method||$host||request_uri||$status||$body_bytes_sent||$http_referer||$upstream_addr||$http_user_agent||";

    access_log              "pipe:/opt/taobao/install/cronolog/sbin/cronolog logs/cronolog/%Y/%m/%Y-%m-%d-taobao-access_log" proxyformat;
    log_not_found           off;

    lua_package_path        "/usr/local/tengine/lib/lua/?.lua;/usr/local/lib/lua/?.lua;;";

    gzip                    on;
    gzip_http_version       1.0;
    gzip_comp_level         6;
    gzip_min_length         1024;
    gzip_proxied            any;
    gzip_vary               on;
    gzip_disable            msie6;
    gzip_buffers            96 8k;
    gzip_types              text/xml text/plain text/css application/javascript application/x-javascript application/rss+xml application/json;

    proxy_set_header        Host $host;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect          off;
    proxy_buffers           128 8k;
    proxy_temp_path         data/proxy;
    proxy_intercept_errors  on;

    variables_hash_max_size     1024;
    variables_hash_bucket_size  64;

    server_names_hash_bucket_size 4096;

    server {
        listen              80 default_server;

        location / {
            proxy_pass   http://127.0.0.1:7001;

            # if you want to enable cell logic, you must change your proxy_pass conf to following
            #
            # proxy_pass $ups;
        }
    }

    server {
        listen              80;
        server_name         status.taobao.com;

        location            = /nginx_status {
            stub_status     on;
        }
    }
}
